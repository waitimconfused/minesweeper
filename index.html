<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minesweeper</title>
	<link rel="stylesheet" href="./style.css">
	<link rel="shortcut icon" href="./assets/favicon.svg" type="image/svg">
</head>

<body>

	<canvas id="screen"></canvas>

	<section id="info">
		<label><img src="./assets/flag.svg" alt="Flags used:"><span id="flags-used">0</span>/<span
				id="flag-count">0</span></label>
		<label><img src="./assets/eye.svg" alt="Revealed tiles:"><span id="tiles-shown">0</span>/<span
				id="tile-count">0</span></label>
	</section>

	<section id="gameover">
		<h1>Game Over!</h1>
		<p>You were <code id="score">~0%</code> complete!</p>
		<button id="reset">Play again</button>
	</section>

	<dialog id="options">

		<h1>Options</h1>

		<button id="opt-reset">New Game</button>

		<div style="
			display: flex;
			flex-direction: row;
			gap: 32px;
			align-items: center;
		">
			<span>Game Size</span>
			<input type="number" placeholder="16" min="8" name="width" id="opt-size-x">
			<input type="number" placeholder="16" min="8" name="height" id="opt-size-y">
		</div>

		<div style="
			display: flex;
			flex-direction: row;
			gap: 32px;
			align-items: center;
		">
			<label for="opt-autoclear">Autoclear</label>
			<input type="checkbox" role="switch" name="autoclear" id="opt-autoclear">
		</div>


	</dialog>

	<section id="win">
		<h1>You win!</h1>
		<p>You found all the bombs!</p>
		<button id="again">Play again?</button>
	</section>

	<button alt="Options-menu toggle" title="Options (ctrl+comma)" command="show-modal" commandfor="options" style="position:fixed; bottom:8px; right:8px; padding: 0; border-radius: 0; background: none;">
		<img src="./assets/gear.svg">
	</button>

	<script src="./dist/index.js" type="module"></script>
	<script src="./dist/other_inputs.js" type="module"></script>
	<script src="./dist/options.js" type="module"></script>
</body>

</html>
