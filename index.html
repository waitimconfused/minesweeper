<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minesweeper</title>
	<link rel="stylesheet" href="./style.css">
	<link rel="shortcut icon" href="./assets/favicon.svg" type="image/svg">
</head>
<body>

	<canvas id="screen"></canvas>

	<section id="info">
		<label><img src="./assets/flag.svg" alt="Flags used:"><span id="flags-used">0</span>/<span id="flag-count">0</span></label>
		<label><img src="./assets/eye.svg" alt="Revealed tiles:"><span id="tiles-shown">0</span>/<span id="tile-count">0</span></label>
	</section>

	<section id="gameover">
		<h1>Game Over!</h1>
		<p>You were <code id="score">~0%</code> complete!</p>
		<button id="reset">Play again</button>
	</section>

	<section id="win">
		<h1>You win!</h1>
		<p>You found all the bombs!</p>
		<button id="again">Play again?</button>
	</section>
	
	<script src="./dist/index.js" type="module"></script>
	<script src="./dist/other_inputs.js" type="module" ></script>
</body>
</html>
